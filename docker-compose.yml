services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: geoconces-db-pgvector
    container_name: geoconces-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geoconces
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geoconces-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoconces-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoconces
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in root .env}"
      ENVIRONMENT: development
      AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python -m alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoconces-worker
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoconces
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in root .env}"
      ENVIRONMENT: development
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    command: python -m celery -A app.core.celery_app.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoconces-beat
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoconces
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in root .env}"
      ENVIRONMENT: development
    depends_on:
      worker:
        condition: service_started
    command: python -m celery -A app.core.celery_app.celery_app beat --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: geoconces-frontend
    profiles: ["fullstack"]
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pg_data:
